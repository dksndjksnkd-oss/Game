
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>My Game Hub</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #151b2b;
      color: white;
      font-family: Arial, sans-serif;
    }
    button {
      padding: 12px 18px;
      margin: 5px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    iframe {
      display: block;
      width: 100%;
      height: 65vh;
      min-height: 350px;
      border: 1px solid #52617a;
      border-radius: 10px;
      background: #080c14;
    }
  </style>
</head>
<body>
  <h1>My Game Hub</h1>
  <p>Select an approved, embeddable game.</p>

  <button onclick="showMessage()">
    Game 1
  </button>

  <div id="game-area">
    <p id="message">
      Your game will appear here.
    </p>
  </div>

  <script>
    function showMessage() {
      document.getElementById("message").textContent =
        "Add a game that permits embedding here.";
    }
<iframe
  src="https://territorial.io/"
  width="100%"
  height="600"
  title="Territorial.io">
</iframe>
  </script>
</body>
</html>
